<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Fundo escuro sólido com bordas arredondadas -->
  <rect width="512" height="512" rx="110" fill="#050811" />
  
  <!-- Círculo branco grande central -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#ffffff" stroke-width="32" />
  
  <!-- Traço vertical da exclamação feito com Retângulo Sólido (nunca some!) -->
  <rect x="234" y="120" width="44" height="175" rx="22" fill="#00d4ff" />
  
  <!-- Ponto inferior da exclamação -->
  <circle cx="256" cy="355" r="26" fill="#00d4ff" />
</svg>
